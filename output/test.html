<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eight Element Renderer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" crossorigin="anonymous">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/styles/github.min.css"
        crossorigin="anonymous">
    </link>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .eight-element-container {
            position: relative;
        }

        * {
            box-sizing: border-box;
        }

        pre code.hljs {
            display: block;
            overflow-x: auto;
            padding: 1em;
        }

        code.hljs {
            padding: 3px 5px;
        }


        .progress-container {
            position: relative;
            width: 200px;
            height: 100px;
        }

        .progress-bg {
            position: absolute;
            width: 200px;
            height: 100px;
            border-radius: 100px 100px 0 0;
            background: conic-gradient(from 180deg, #ef4444 0deg 27deg, #fee2e2 27deg 180deg);
        }

        .progress-inner {
            position: absolute;
            width: 168px;
            height: 84px;
            top: 16px;
            left: 16px;
            background: white;
            border-radius: 84px 84px 0 0;
        }

        .progress-value {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 36px;
            font-weight: bold;
            color: #ef4444;
        }

        .p25 .progress-bg {
            background: conic-gradient(from 180deg, #ef4444 0deg 45deg, #fee2e2 45deg 180deg);
        }
    </style>
</head>

<body>
    <div class="progress-container">
        <div class="progress-bg"></div>
        <div class="progress-inner"></div>
        <div class="progress-value">15%</div>
    </div>

    <div class="progress-container p25">
        <div class="progress-bg"></div>
        <div class="progress-inner"></div>
        <div class="progress-value">25%</div>
    </div>
</body>

</html>
